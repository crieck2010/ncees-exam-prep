name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  engine-tests:
    name: Engine Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ./engine

      - name: Run pytest
        run: |
          pytest ./engine/tests -v

  mobile-tests:
    name: Mobile App (Flutter Lint & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze code (lints)
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  bank-integration:
    name: Question Bank Integration Check
    runs-on: ubuntu-latest
    needs: [engine-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: |
          pip install -e ./engine

      - name: Generate fresh test banks
        run: |
          python mobile/tools/generate_banks.py --n 2 --seeds 7 42

      - name: Validate generated banks exist
        run: |
          test -f mobile/assets/banks/bank-seed-7.json
          test -f mobile/assets/banks/bank-seed-42.json
